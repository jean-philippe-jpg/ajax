<div class="hero-scene text-center text-white">
<div class="hero-scene-content">
      
    <h1>Inscription</h1>
    
</div>
</div>
<div class="container ">
<form id="form-signup">
    <div class="mb-3">
    <label for="firstName" class="form-label">Nom</label>
    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Nom" >
  </div>
    <div class="mb-3">
    <label for="lastName" class="form-label">Prenom</label>
    <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Prenom" >
  </div>
  <div class="mb-3">
    <label for="inputEmail" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputEmail" name="email" placeholder="championauto@gmail.com" >
  </div>
  <div class="mb-3">
    <label for="InputPassword" class="form-label">Mot de passe</label>
    <input type="password" class="form-control" name="password" id="InputPassword">
  </div>
  <div class="mb-3">
    <label for="valideInputPassword" class="form-label">Validez votre mot de passe</label>
    <input type="password" class="form-control" id="valideInputPassword">
  </div>
  <div class="text-center">
  <button type="button" class="btn btn-primary " id="btnValidate" >Inscription</button>
  </div>
</form>
<div class="text-center pt-3">
    <a href="/signup">Connexion</a>
</div>
</div>
